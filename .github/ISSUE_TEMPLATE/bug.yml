---
name: "Bug report"
description: "Something does not work as described in the README"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please search the [existing issues](https://github.com/polar-gith/ha-zeptrion-air-integration/issues?q=is%3Aissue) first.
        The more of the details below you give, the faster it can be fixed.
  - type: input
    id: integration_version
    attributes:
      label: "Integration version"
      description: "Settings → Devices & services → Zeptrion Air, or the version shown in HACS."
      placeholder: "2026.11.26"
    validations:
      required: true
  - type: input
    id: ha_version
    attributes:
      label: "Home Assistant version"
      placeholder: "2026.11.1"
    validations:
      required: true
  - type: input
    id: zapp
    attributes:
      label: "zApp model and firmware"
      description: "From the device page of the zApp (model and firmware), e.g. 3340-2-B, 01.08.28."
      placeholder: "3340-2-B, firmware 01.08.28"
    validations:
      required: true
  - type: dropdown
    id: channel_type
    attributes:
      label: "Affected function"
      multiple: true
      options:
        - "Blind / awning (position, direction, slats, scenes)"
        - "Light (switch / dimmer, scenes)"
        - "Wall keys / Smartbuttons"
        - "Smartfront LEDs or sensors"
        - "Connection / availability"
        - "Setup, discovery or options"
        - "Dashboard card, scenes feature or dashboard"
        - "Other"
    validations:
      required: true
  - type: dropdown
    id: button_face
    attributes:
      label: "Button face on the zApp"
      options:
        - "Smartfront (with LEDs / Smartbuttons)"
        - "Older button face (no Smartfront)"
        - "None (zApp in the distribution board)"
        - "Don't know"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: "What happens, and what did you expect?"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: "Steps to reproduce"
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: "Diagnostics"
      description: "Settings → Devices & services → Zeptrion Air → ⋮ next to the affected zApp → Download diagnostics, then drag the file here. Host, serial and names are removed from it."
  - type: textarea
    id: logs
    attributes:
      label: "Debug log"
      description: |
        Settings → Devices & services → Zeptrion Air → ⋮ → Enable debug logging, reproduce the problem, then disable it again; the log downloads. Paste the relevant part here.
      render: text
  - type: checkboxes
    id: checklist
    attributes:
      label: "Checklist"
      options:
        - label: "This issue describes one problem only."
          required: true
        - label: "I have read the README section about this function and its Limitations."
          required: true
