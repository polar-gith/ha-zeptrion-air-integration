---
name: "Feature request"
description: "Suggest a new function or an improvement"
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please search the [existing issues](https://github.com/polar-gith/ha-zeptrion-air-integration/issues?q=is%3Aissue) first.
        If the request needs a zApp function, say which part of the zApp API it uses, if you know it (see `docs/` in this repository).
  - type: textarea
    id: problem
    attributes:
      label: "What do you want to do?"
      description: "Describe the situation and what is missing today."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: "How should it work?"
    validations:
      required: true
  - type: input
    id: zapp
    attributes:
      label: "zApp model and firmware (if hardware related)"
      placeholder: "3340-4-B, firmware 01.08.28"
  - type: textarea
    id: alternatives
    attributes:
      label: "Workarounds or alternatives you tried"
  - type: checkboxes
    id: checklist
    attributes:
      label: "Checklist"
      options:
        - label: "This request covers one feature only."
          required: true
