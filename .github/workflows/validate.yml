name: "Validate"

on:
  workflow_dispatch:
  schedule:
    - cron:  "0 0 * * *"
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

jobs:
  validate:
    runs-on: "ubuntu-latest"
    steps:
        - uses: "actions/checkout@v4"
        - uses: "home-assistant/actions/hassfest@master"
        
  hacs: # https://github.com/hacs/action
    name: "HACS Validation"
    runs-on: "ubuntu-latest"
    steps:
        - name: "Checkout the repository"
          uses: "actions/checkout@v4.1.7"

        - name: "Run HACS validation"
          uses: "hacs/action@main"
          with:
            category: "integration"
            # brands: the integration ships its own brand images (custom_components/zeptrion_air/brand).
            # issues/topics: repository settings, only required for the default HACS store;
            # this repository is installed as a custom repository.
            ignore: "brands issues topics"
