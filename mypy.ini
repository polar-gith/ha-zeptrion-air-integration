[mypy]
python_version = 3.14
strict = True
ignore_missing_imports = True
warn_unused_ignores = True

# Home Assistant 2026.9+ runs voluptuous on Probatio (``import voluptuous`` is an
# alias). The schemas are checked at runtime; the type checker does not follow it.
[mypy-voluptuous,voluptuous.*]
follow_imports = skip
