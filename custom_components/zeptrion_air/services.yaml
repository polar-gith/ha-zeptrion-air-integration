blind_up_step:
  target:
    entity:
      integration: zeptrion_air
      domain: cover

blind_down_step:
  target:
    entity:
      integration: zeptrion_air
      domain: cover

blind_recall_s1:
  target:
    entity:
      integration: zeptrion_air
      domain: cover

blind_recall_s2:
  target:
    entity:
      integration: zeptrion_air
      domain: cover

blind_recall_s3:
  target:
    entity:
      integration: zeptrion_air
      domain: cover

blind_recall_s4:
  target:
    entity:
      integration: zeptrion_air
      domain: cover

blind_store_scene:
  target:
    entity:
      integration: zeptrion_air
      domain: cover
  fields:
    scene:
      required: true
      example: 1
      selector:
        number:
          min: 1
          max: 4
          mode: box

blind_calibrate:
  target:
    entity:
      integration: zeptrion_air
      domain: cover

light_store_scene:
  target:
    entity:
      integration: zeptrion_air
      domain: light
  fields:
    scene:
      required: true
      example: 1
      selector:
        number:
          min: 1
          max: 4
          mode: box

light_recall_scene:
  target:
    entity:
      integration: zeptrion_air
      domain: light
  fields:
    scene:
      required: true
      example: 1
      selector:
        number:
          min: 1
          max: 4
          mode: box

program_smartbutton:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: zeptrion_air
    actions:
      example: "[{entity_id: cover.play_blind, command: recall_s1}]"
      selector:
        object:
    requests:
      selector:
        object:
    wait:
      default: 60
      selector:
        number:
          min: 10
          max: 120
          unit_of_measurement: s

write_name_to_zapp:
  target:
    entity:
      integration: zeptrion_air
      domain:
        - cover
        - light
  fields:
    name:
      selector:
        text:
    group:
      selector:
        text:
